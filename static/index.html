<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>API Doc QA Bot</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
      --border:#30363d;--border2:#21262d;
      --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
      --primary:#58a6ff;--primary-dark:#1f6feb;--primary-dim:rgba(88,166,255,.15);
      --green:#3fb950;--green-dim:rgba(63,185,80,.15);
      --yellow:#d29922;--yellow-dim:rgba(210,153,34,.15);
      --red:#f85149;--red-dim:rgba(248,81,73,.15);
      --purple:#bc8cff;--purple-dim:rgba(188,140,255,.15);
      --radius:6px;--radius-lg:12px;
    }
    html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}

    /* ─ Layout ─ */
    .app{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:260px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .drawer{width:320px;min-width:320px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
    .drawer.collapsed{width:0;min-width:0;border:none;overflow:hidden}

    /* ─ Sidebar ─ */
    .sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .logo-icon{width:36px;height:36px;border-radius:var(--radius);background:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:18px}
    .logo-text{font-size:15px;font-weight:700;color:var(--text)}
    .logo-sub{font-size:11px;color:var(--text3);margin-top:1px}
    .sys-badges{display:flex;gap:6px;flex-wrap:wrap}
    .badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
    .badge-on{background:var(--green-dim);color:var(--green);border:1px solid rgba(63,185,80,.3)}
    .badge-off{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
    .badge-primary{background:var(--primary-dim);color:var(--primary);border:1px solid rgba(88,166,255,.3)}

    .sidebar-scroll{flex:1;overflow-y:auto;padding:12px}
    .sec-title{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:0 4px;margin-bottom:6px;margin-top:12px}
    .sec-title:first-child{margin-top:0}
    .nav-btn{width:100%;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);color:var(--text2);font-size:13px;text-align:left;transition:background .15s,color .15s}
    .nav-btn:hover{background:var(--bg3);color:var(--text)}
    .nav-btn.active{background:var(--primary-dim);color:var(--primary)}
    .nav-btn .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
    .nav-btn .cnt{margin-left:auto;background:var(--bg4);border-radius:10px;padding:0 6px;font-size:11px;color:var(--text3)}

    .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
    .stat-card{background:var(--bg3);border-radius:var(--radius);padding:8px 10px;text-align:center}
    .stat-val{font-size:18px;font-weight:700;color:var(--primary)}
    .stat-lbl{font-size:11px;color:var(--text3);margin-top:1px}

    /* ─ Main ─ */
    .main-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:10px;flex-shrink:0}
    .main-header h1{font-size:15px;font-weight:700;color:var(--text);flex:1}
    .icon-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;color:var(--text2);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;transition:all .15s}
    .icon-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}

    /* ─ Chat ─ */
    .chat-area{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
    .welcome{text-align:center;padding:48px 20px;color:var(--text3)}
    .welcome .w-icon{font-size:40px;margin-bottom:12px}
    .welcome h2{font-size:18px;color:var(--text2);font-weight:600;margin-bottom:8px}
    .welcome p{font-size:13px;margin-bottom:20px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
    .chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim)}

    /* ─ Messages ─ */
    .msg{display:flex;gap:12px;max-width:840px;width:100%;align-self:flex-start}
    .msg.user-msg{align-self:flex-end;flex-direction:row-reverse}
    .msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:2px}
    .msg-avatar.bot-av{background:var(--primary-dark)}
    .msg-avatar.usr-av{background:var(--bg4);border:1px solid var(--border)}
    .msg-body{flex:1;min-width:0}
    .msg-bubble{padding:12px 16px;border-radius:var(--radius-lg);line-height:1.7;word-break:break-word}
    .bot-bubble{background:var(--bg2);border:1px solid var(--border)}
    .usr-bubble{background:var(--primary-dark);color:#fff;border-radius:var(--radius-lg);border-bottom-right-radius:4px}
    .user-msg .msg-body{align-items:flex-end;display:flex;flex-direction:column}
    .msg-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
    .user-msg .msg-meta{justify-content:flex-end}
    .meta-pill{padding:2px 8px;border-radius:12px;font-size:11px}
    .pill-doc{background:var(--primary-dim);color:var(--primary);border:1px solid rgba(88,166,255,.25)}
    .pill-pattern{background:var(--green-dim);color:var(--green);border:1px solid rgba(63,185,80,.25)}
    .pill-dspy{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(188,140,255,.25)}
    .pill-template{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
    .pill-time{font-size:11px;color:var(--text3)}
    .conf-bar{height:3px;background:var(--bg3);border-radius:2px;margin-top:5px;overflow:hidden;max-width:200px}
    .conf-fill{height:100%;border-radius:2px;transition:width .5s}

    /* ─ Chunks Used ─ */
    .chunks-used{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .chunks-header{background:var(--bg3);padding:6px 10px;font-size:11px;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
    .chunks-list{display:none;padding:6px}
    .chunks-list.open{display:block}
    .chunk-item{padding:4px 8px;border-radius:4px;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:8px;margin-bottom:2px}
    .chunk-item:hover{background:var(--bg3)}
    .chunk-score{margin-left:auto;color:var(--text3);font-size:10px}

    /* ─ Typing ─ */
    .typing{display:flex;gap:4px;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);width:fit-content}
    .typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.2s}
    .typing span:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

    /* ─ Markdown Content ─ */
    .md-content code{background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:"SF Mono","Fira Code",monospace;font-size:12px;color:var(--primary)}
    .md-content pre{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 16px;overflow-x:auto;margin:8px 0;line-height:1.5}
    .md-content pre code{background:none;border:none;padding:0;color:var(--text2);font-size:12.5px;font-family:"SF Mono","Fira Code",monospace}
    .md-content h1{font-size:18px;font-weight:600;color:var(--text);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .md-content h2{font-size:15px;font-weight:600;color:var(--text);margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
    .md-content h3{font-size:13px;font-weight:600;color:var(--text);margin:12px 0 6px}
    .md-content h4{font-size:12px;font-weight:600;color:var(--text);margin:10px 0 4px}
    .md-content p{margin:2px 0;line-height:1.6}
    .md-content a{color:var(--primary);text-decoration:none}
    .md-content a:hover{text-decoration:underline}
    .md-content hr{border:none;border-top:1px solid var(--border);margin:14px 0}
    .md-content ul,.md-content ol{padding-left:22px;margin:6px 0}
    .md-content li{margin:0;line-height:1.3}
    .md-content strong{color:var(--text);font-weight:600}
    .md-content table{border-collapse:collapse;margin:10px 0;font-size:12px;display:block;overflow-x:auto;max-width:100%}
    .md-content thead{border-bottom:2px solid var(--border)}
    .md-content th,.md-content td{border:1px solid var(--border);padding:7px 12px;text-align:left;white-space:nowrap}
    .md-content th{background:var(--bg3);color:var(--text);font-weight:600;font-size:12px}
    .md-content td{color:var(--text2);background:var(--bg1)}
    .md-content tbody tr:nth-child(even) td{background:var(--bg2)}
    .md-content blockquote{border-left:3px solid var(--primary);padding:6px 14px;background:var(--primary-dim);border-radius:0 var(--radius) var(--radius) 0;margin:8px 0;color:var(--text2);font-style:italic}

    /* ─ Input Bar ─ */
    .input-bar{padding:14px 20px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
    .input-wrap{display:flex;gap:10px;align-items:flex-end;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 14px;transition:border .2s}
    .input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(88,166,255,.1)}
    #q-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;resize:none;max-height:120px;line-height:1.5;font-family:inherit}
    #q-input::placeholder{color:var(--text3)}
    .send-btn{width:36px;height:36px;border-radius:var(--radius);background:var(--primary-dark);border:none;color:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
    .send-btn:hover{background:var(--primary)}
    .send-btn:disabled{background:var(--bg4);color:var(--text3);cursor:not-allowed}
    .input-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--text3);padding:0 4px}

    /* ─ Drawer ─ */
    .drawer-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
    .drawer-title{font-size:13px;font-weight:600;flex:1;color:var(--text)}
    .drawer-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:4px;border-radius:var(--radius)}
    .drawer-close:hover{color:var(--text);background:var(--bg3)}
    .drawer-body{flex:1;overflow-y:auto;padding:12px}

    /* ─ Pattern Cards ─ */
    .pattern-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border .15s}
    .pattern-card:hover{border-color:var(--primary)}
    .pat-q{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
    .pat-a{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .pat-foot{display:flex;gap:6px;align-items:center;margin-top:6px}
    .cat-pill{padding:1px 8px;border-radius:12px;font-size:10px;background:var(--primary-dim);color:var(--primary);border:1px solid rgba(88,166,255,.25)}
    .hit-num{font-size:11px;color:var(--text3);margin-left:auto}

    /* ─ Doc Chunks ─ */
    .doc-chunk{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px}
    .doc-chunk-title{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:4px}
    .doc-chunk-src{font-size:10px;color:var(--text3);margin-bottom:4px}
    .doc-chunk-body{font-size:11px;color:var(--text2);line-height:1.5;max-height:80px;overflow:hidden;position:relative}
    .doc-chunk-body::after{content:"";position:absolute;bottom:0;left:0;right:0;height:24px;background:linear-gradient(transparent,var(--bg3))}

    /* ─ Vault ─ */
    .vault-folder{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px;padding:0 4px}
    .vault-file{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:12px;transition:background .15s}
    .vault-file:hover{background:var(--bg3);color:var(--text)}
    .vault-file .vsize{margin-left:auto;font-size:10px;color:var(--text3)}
    .md-preview{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:12px;line-height:1.6;color:var(--text2);white-space:pre-wrap;max-height:400px;overflow-y:auto;margin-top:8px}

    /* ─ Search ─ */
    .search-wrap{display:flex;gap:6px;margin-bottom:10px}
    .search-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);font-size:12px;outline:none}
    .search-input:focus{border-color:var(--primary)}
    .btn-xs{padding:7px 10px;border-radius:var(--radius);border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
    .btn-blue{background:var(--primary-dark);color:#fff}
    .btn-blue:hover{background:var(--primary)}
    .btn-green{background:rgba(63,185,80,.2);color:var(--green);border:1px solid rgba(63,185,80,.3)}
    .btn-green:hover{background:rgba(63,185,80,.35)}

    /* ─ Empty ─ */
    .empty{text-align:center;padding:28px 16px;color:var(--text3);font-size:13px}
    .empty .ei{font-size:28px;margin-bottom:8px}

    /* ─ Scrollbar ─ */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:var(--border)}

    /* ─ Util ─ */
    .spin{animation:spin 1s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none !important}
    .divider{height:1px;background:var(--border);margin:8px 0}
    .flex-c{display:flex;align-items:center;gap:8px}

    /* ─ Settings ─ */
    .settings-panel{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
    .settings-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .settings-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
    .settings-label{font-size:12px;color:var(--text3);font-weight:600}
    .settings-input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border .2s}
    .settings-input:focus{border-color:var(--primary)}
    .settings-select{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;width:100%;outline:none;cursor:pointer}
    .settings-btn{display:flex;gap:8px;margin-top:8px}
    .btn-primary{padding:8px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
    .btn-primary.blue{background:var(--primary-dark);color:#fff}
    .btn-primary.blue:hover{background:var(--primary)}
    .btn-primary.green{background:rgba(63,185,80,.2);color:var(--green);border:1px solid rgba(63,185,80,.3)}
    .btn-primary.green:hover{background:rgba(63,185,80,.35)}
    .btn-primary.gray{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
    .btn-primary.gray:hover{background:var(--bg3)}
    .test-result{padding:10px;border-radius:var(--radius);margin-top:8px;font-size:12px}
    .test-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(63,185,80,.3)}
    .test-error{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,81,73,.3)}
    .test-info{background:var(--primary-dim);color:var(--primary);border:1px solid rgba(88,166,255,.3)}
    .toggle-wrap{display:flex;align-items:center;gap:10px}
    .toggle{position:relative;width:40px;height:22px;background:var(--bg4);border-radius:11px;cursor:pointer;transition:background .2s}
    .toggle.active{background:var(--green)}
    .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
    .toggle.active::after{transform:translateX(18px)}
    .provider-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
    .provider-card{background:var(--bg2);border:2px solid var(--border);border-radius:var(--radius);padding:10px;cursor:pointer;transition:all .15s;text-align:center}
    .provider-card:hover{border-color:var(--primary)}
    .provider-card.selected{border-color:var(--primary);background:var(--primary-dim)}
    .provider-card .p-icon{font-size:20px;margin-bottom:4px}
    .provider-card .p-name{font-size:11px;color:var(--text2)}
    .provider-card.selected .p-name{color:var(--primary)}
    .param-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .param-item{display:flex;flex-direction:column;gap:4px}
    .param-label{font-size:11px;color:var(--text3)}
    .param-input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;color:var(--text);font-size:12px;outline:none}
    .param-input:focus{border-color:var(--primary)}
    .model-select{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;width:100%;outline:none;cursor:pointer}
  </style>
</head>
<body>
<div class="app">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">📚</div>
        <div>
          <div class="logo-text">API Doc QA</div>
          <div class="logo-sub">文档驱动·自学习问答</div>
        </div>
      </div>
      <div class="sys-badges">
        <span id="badge-rag"  class="badge badge-off">RAG</span>
        <span id="badge-chunks" class="badge badge-primary">— 块</span>
      </div>
    </div>

    <div class="sidebar-scroll">
      <div class="sec-title">本次会话</div>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-val" id="s-turns">0</div><div class="stat-lbl">提问数</div></div>
        <div class="stat-card"><div class="stat-val" id="s-hits">0</div><div class="stat-lbl">文档命中</div></div>
      </div>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-val" id="s-patterns">-</div><div class="stat-lbl">经验模式</div></div>
        <div class="stat-card"><div class="stat-val" id="s-conf">-%</div><div class="stat-lbl">平均置信</div></div>
      </div>

      <div class="divider"></div>
      <div class="sec-title">导航</div>
      <button class="nav-btn active" id="nb-chat" onclick="setDrawer('none',this)">
        <span class="icon">💬</span> 问答对话
      </button>
      <button class="nav-btn" id="nb-docs" onclick="setDrawer('docs',this)">
        <span class="icon">📄</span> 文档管理
        <span class="cnt" id="cnt-docs">-</span>
      </button>

      <div class="divider"></div>
      <div class="sec-title">操作</div>
      <button class="nav-btn" onclick="refreshDocs()">
        <span class="icon">🔄</span> 刷新文档
      </button>
      <button class="nav-btn" onclick="clearChat()">
        <span class="icon">🗑️</span> 清空对话
      </button>
      <button class="nav-btn" id="nb-settings" onclick="setDrawer('settings',this)">
        <span class="icon">⚙️</span> AI 设置
      </button>

      <div class="divider"></div>
      <div class="sec-title">快捷提问</div>
      <button class="nav-btn" onclick="ask('How to do KYC? What documents are needed?')"><span class="icon">🆔</span>KYC 所需材料</button>
      <button class="nav-btn" onclick="ask('How to apply for a debit card?')"><span class="icon">💳</span>如何申请银行卡</button>

<script>
// ══════════════════════════════════════════════
// State
// ══════════════════════════════════════════════
let turns = 0, docHits = 0, totalConf = 0;
let isLoading = false;
let currentDrawer = 'none';

// ══════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  window.__session_id = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  fetchHealth();
  setInterval(fetchHealth, 20000);
});

async function fetchHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    document.getElementById('badge-rag').className  = d.rag_enabled  ? 'badge badge-on'      : 'badge badge-off';
    document.getElementById('badge-rag').textContent  = d.rag_enabled  ? 'RAG ✓' : 'RAG';
    document.getElementById('badge-chunks').textContent = d.doc_chunks + ' 块';
    document.getElementById('cnt-docs').textContent = d.doc_chunks;
    document.getElementById('s-patterns').textContent = d.patterns_count;
  } catch {}
}

// ══════════════════════════════════════════════
// Chat
// ══════════════════════════════════════════════
function handleKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQ(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function ask(text) {
  document.getElementById('q-input').value = text;
  sendQ();
}

async function sendQ() {
  if (isLoading) return;
  const input = document.getElementById('q-input');
  const q = input.value.trim();
  if (!q) return;

  input.value = ''; input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  document.getElementById('input-status').textContent = '⏳ 检索文档中...';
  isLoading = true;

  const welcome = document.getElementById('welcome');
  if (welcome) { welcome.style.display = 'none'; }

  appendUserMsg(q);
  const tid = appendTyping();

  try {
    const res  = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: window.__session_id || 'default' })
    });
    const data = await res.json();
    removeTyping(tid);
    appendBotMsg(data, q);

    // Update stats
    turns++;
    if (data.doc_hits > 0) docHits++;
    totalConf += data.confidence;
    document.getElementById('s-turns').textContent = turns;
    document.getElementById('s-hits').textContent  = docHits;
    document.getElementById('s-conf').textContent  = Math.round(totalConf / turns * 100) + '%';

    // Refresh KB count
    setTimeout(fetchHealth, 1000);
    document.getElementById('input-status').textContent = '';
  } catch (err) {
    removeTyping(tid);
    appendBotMsg({
      answer: '❌ 服务器连接失败，请确认后端已启动：\n\n```\ncd /Users/onchain/wys/pytools/dspy\npython server.py\n```',
      source: 'error', doc_hits: 0, confidence: 0, chunks_used: [], method: 'none'
    }, q);
    document.getElementById('input-status').textContent = '';
  }
  isLoading = false;
  document.getElementById('send-btn').disabled = false;
}

function appendUserMsg(text) {
  const box = document.getElementById('chat-box');
  const row = document.createElement('div');
  row.className = 'msg user-msg';
  row.innerHTML = `
    <div class="msg-avatar usr-av">👤</div>
    <div class="msg-body">
      <div class="msg-bubble usr-bubble">${esc(text)}</div>
      <div class="msg-meta"><span class="pill-time">${now()}</span></div>
    </div>`;
  box.appendChild(row);
  scrollBot();
}

function appendBotMsg(data, question) {
  const box = document.getElementById('chat-box');
  const row = document.createElement('div');
  row.className = 'msg';

  const src = data.source || 'ai';
  const srcClass  = src === 'ai' ? 'pill-pattern' : 'pill-template';
  const srcLabel  = src === 'ai' ? '🤖 AI' : '⚠️ 错误';
  const docTag    = data.doc_hits > 0 ? `<span class="meta-pill pill-doc">📄 文档 ×${data.doc_hits}</span>` : '';
  const methodTag = data.method && data.method !== 'none' && data.method !== 'pattern'
    ? `<span class="meta-pill pill-template">${data.method === 'semantic' ? '🔍 语义' : '🔤 关键词'}</span>` : '';
  const confPct   = Math.round((data.confidence || 0) * 100);
  const confColor = confPct >= 80 ? 'var(--green)' : confPct >= 60 ? 'var(--yellow)' : 'var(--red)';

  // Chunks used
  let chunksHtml = '';
  if (data.chunks_used && data.chunks_used.length > 0) {
    const items = data.chunks_used.map(c =>
      `<div class="chunk-item">📌 ${esc(c.title_path)}<span class="chunk-score">${(c.score*100).toFixed(0)}%</span></div>`
    ).join('');
    chunksHtml = `
      <div class="chunks-used">
        <div class="chunks-header" onclick="toggleChunks(this)">
          ▶ 引用文档片段 (${data.chunks_used.length})
        </div>
        <div class="chunks-list">${items}</div>
      </div>`;
  }

  row.innerHTML = `
    <div class="msg-avatar bot-av">🤖</div>
    <div class="msg-body">
      <div class="msg-bubble bot-bubble md-content">${mdRender(data.answer)}</div>
      ${chunksHtml}
      <div class="conf-bar"><div class="conf-fill" style="width:${confPct}%;background:${confColor}"></div></div>
      <div class="msg-meta">
        <span class="meta-pill ${srcClass}">${srcLabel}</span>
        ${docTag}${methodTag}
        <span class="meta-pill pill-template">${confPct}% 置信</span>
        <span class="pill-time">${now()}</span>
      </div>
    </div>`;
  box.appendChild(row);
  scrollBot();
}

let _tc = 0;
function appendTyping() {
  const id = 'tp-' + ++_tc;
  const box = document.getElementById('chat-box');
  const row = document.createElement('div');
  row.className = 'msg'; row.id = id;
  row.innerHTML = `<div class="msg-avatar bot-av">🤖</div><div class="typing"><span></span><span></span><span></span></div>`;
  box.appendChild(row);
  scrollBot();
  return id;
}
function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

function clearChat() {
  const box = document.getElementById('chat-box');
  box.innerHTML = `<div class="welcome" id="welcome"><div class="w-icon">📚</div><h2>对话已清空</h2><p>随时开始新的提问</p></div>`;
  turns=0; docHits=0; totalConf=0;
  document.getElementById('s-turns').textContent = '0';
  document.getElementById('s-hits').textContent  = '0';
  document.getElementById('s-conf').textContent  = '-%';
}

function toggleChunks(el) {
  const list = el.nextElementSibling;
  const open = list.classList.toggle('open');
  el.textContent = (open ? '▼' : '▶') + el.textContent.slice(1);
}

// ══════════════════════════════════════════════
// Drawer
// ══════════════════════════════════════════════
function setDrawer(name, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nb-chat').classList.add('active');
  if (btn) btn.classList.add('active');

  const drawer = document.getElementById('drawer');
  if (name === 'none' || currentDrawer === name) {
    drawer.classList.add('collapsed');
    currentDrawer = 'none';
    return;
  }
  drawer.classList.remove('collapsed');
  currentDrawer = name;

  const titles = { docs: '📄 文档管理', settings: '⚙️ AI 设置' };
  document.getElementById('drawer-title').textContent = titles[name] || name;

  if (name === 'docs')    renderDocs();
  if (name === 'settings') renderSettings();
}

    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:10px">

async function resetDocs() {
  if (!confirm('确认清空所有导入的文档，恢复为默认知识库？')) return;
  try {
    const r = await fetch('/api/docs/reset', { method: 'DELETE' });

    alert(d.message);
    renderDocs();
    fetchHealth();
  } catch {}

async function uploadFile() {
  const file = document.getElementById('import-file').files[0];
  if (!file) return;
  const msg = document.getElementById('import-msg');
  msg.textContent = '上传中...';
  const form = new FormData();
  form.append('file', file);
  try {
    const r = await fetch('/api/docs/upload', { method: 'POST', body: form });
    const d = await r.json();
    if (d.error) { msg.textContent = d.error; return; }
    msg.textContent = `已导入 ${d.chunks} 块`;
    loadDocSources();
    fetchHealth();
  } catch { msg.textContent = '上传失败'; }

  const name = document.getElementById('import-name').value.trim();
  const url = document.getElementById('import-url').value.trim();
  const msg = document.getElementById('import-msg');
  if (!name || !url) { msg.textContent = '请填写名称和 URL'; return; }
  msg.textContent = '导入中...';
  try {
    const r = await fetch('/api/docs/import', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, url})
    });
    const d = await r.json();
    if (d.error) { msg.textContent = d.error; return; }
    msg.textContent = `已导入 ${d.chunks} 块`;
    loadDocSources();
    fetchHealth();
  } catch { msg.textContent = '导入失败'; }

  try {
    const r = await fetch('/api/docs/sources');
    const d = await r.json();
    const el = document.getElementById('doc-sources');
    el.innerHTML = d.sources.map(s => `
      <div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:var(--text2)">
        <span>📄 ${esc(s.name)} (${s.chunks}块)</span>
        <button class="btn-xs" style="margin-left:auto;background:var(--red-dim);color:var(--red);border:1px solid rgba(248,81,73,.3);font-size:9px;padding:1px 5px" onclick="delDocSource('${esc(s.name)}')">删除</button>

async function delDocSource(name) {
  if (!confirm(`确认删除文档源「${name}」？`)) return;
  try {
    await fetch(`/api/docs/remove?name=${encodeURIComponent(name)}`, { method: 'DELETE' });
    loadDocSources();
    fetchHealth();

async function crawlDoc() {
  const keyword = document.getElementById('crawl-keyword').value.trim();

  const msg = document.getElementById('crawl-msg');
  msg.textContent = '搜索抓取中...';

// ══════════════════════════════════════════════
// Markdown Renderer (lightweight)
// ══════════════════════════════════════════════
function mdRender(text) {
  if (!text) return '';
  let s = text;

  // 表格：先换成占位符，esc 后再换回，避免 HTML 标签被转义
  let tables = [];
  s = s.replace(/(^\|.+?\|$\n?)+/gm, function(block) {
    let lines = block.trim().split('\n').filter(l => l.includes('|'));
    if (lines.length < 2) return block;
    let headerRow = '', bodyRows = '';
    let headerDone = false;
    for (let line of lines) {
      let cells = line.split('|').filter(c => c.trim() !== '');
      let isSep = cells.every(c => /^[-:]+$/.test(c.trim()));
      if (isSep) { headerDone = true; continue; }
      let tdTag = headerDone ? 'td' : 'th';
      let rowHtml = '<tr>' + cells.map(c => `<${tdTag}>${c.trim()}</${tdTag}>`).join('') + '</tr>';
      if (!headerDone) headerRow += rowHtml;
      else bodyRows += rowHtml;
    }
    let html = `<table><thead>${headerRow}</thead><tbody>${bodyRows}</tbody></table>`;
    tables.push(html);
    return `%%TABLE_${tables.length - 1}%%`;
  });

  s = esc(s);

  // 换回表格 HTML
  tables.forEach((html, i) => { s = s.replace(`%%TABLE_${i}%%`, html); });

  // Code blocks (fenced)
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code class="language-${lang}">${code}</code></pre>`);
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Headers
  s = s.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // HR
  s = s.replace(/^---$/gm, '<hr>');
  // Blockquote
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Links
  s = s.replace(/\[(.+?)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // List items
  s = s.replace(/^[•\-\*] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
  // 去掉 li 之间的换行，防止被转成 <br> 导致间距
  s = s.replace(/<\/li>\n<li>/g, '</li><li>');
  // Double newline → paragraph break
  s = s.replace(/\n\n/g, '</p><p>');
  // Single newline → br
  s = s.replace(/\n/g, '<br>');
  return s;
}

// ══════════════════════════════════════════════
// Utils
// ══════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function scrollBot() {
  const b = document.getElementById('chat-box');
  b.scrollTop = b.scrollHeight;
}
function now() {
  return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes+'B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1048576).toFixed(1)+'MB';
}
</script>
