# =============================================================================
# PayCrypto API 智能客服系统 - Docker Compose 配置
# =============================================================================
# 使用方法:
#   启动: docker-compose up -d
#   停止: docker-compose down
#   查看日志: docker-compose logs -f
# =============================================================================

version: '3.8'

services:
  # 客服系统主服务
  paycrypto-cs:
    build:
      context: .
      dockerfile: Dockerfile
    image: paycrypto-cs:latest
    container_name: paycrypto-cs
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # AI 提供商配置（通过环境变量注入，避免敏感信息写入镜像）
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-deepseek}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - USE_CHROMA=${USE_CHROMA:-false}
    volumes:
      # 挂载配置文件（不包含敏感信息）
      - ./api_config.json:/app/api_config.json:ro
      # 持久化内存存储
      - ./data/memory:/app/memory_store.json
      # 持久化向量数据库
      - ./data/chroma:/app/chroma_db
      # 持久化文档缓存
      - ./data/docs_cache:/app/docs_cache
      # 日志目录
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - paycrypto-network

  # （可选）Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: paycrypto-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - paycrypto-cs
    networks:
      - paycrypto-network
    profiles:
      - with-nginx  # 默认不启动，需要时使用 --profile with-nginx

networks:
  paycrypto-network:
    driver: bridge

volumes:
  memory-data:
  chroma-data:
  docs-cache:
  logs:
